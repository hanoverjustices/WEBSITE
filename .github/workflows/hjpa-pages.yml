name: Publish HJPA website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hjpa-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - uses: actions/configure-pages@v5
      - name: Check site builder Python syntax
        run: python -m py_compile scripts/build_content.py
      - name: Generate poster and slideshow indexes
        run: python scripts/build_content.py
      - name: Check document reader JavaScript syntax
        run: node --check scripts/hjpa-document-reader.js
      - name: Check published local PDF and logo assets
        run: |
          test -s _site/index.html
          test -s _site/notice-assets/site-images/78326aac0c092349df10.png
          test -s _site/scripts/hjpa-document-reader.js
          test -s _site/documents.html
          grep -q 'hjpa-document-reader.js' _site/documents.html
          grep -q 'documents.html' _site/index.html
          test -s _site/leadership.html
          test -s _site/services.html
          test -s _site/resources.html
          test -s _site/find-services.html
          test -s _site/annual-report.html
          test -s _site/gallery.html
          test -s _site/memorials.html
          test -s _site/media.html
          test -s _site/justice-centre.html
          test ! -e _site/notice-assets/gia-documents/manual.pdf
          ! grep -q 'notice-assets/gia-documents/manual.pdf' _site/index.html
          ! grep -q 'JP Qualifying Training Manual' _site/index.html
      - name: Audit local navigation and published assets
        run: python scripts/audit_published_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
